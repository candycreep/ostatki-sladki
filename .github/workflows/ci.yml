name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  requirements:
    name: Requirements are traceable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every matrix row has a requirement ID
        run: |
          set -euo pipefail
          found=$(grep -nE '^\|' docs/traceability.md \
            | grep -vE '^[0-9]+:\|[-:| ]+$' \
            | grep -vE '^[0-9]+:\| (ID|Критерий|Шаг пути) ' \
            | grep -vE '(FR|NFR|BR|C)-[0-9]+' || true)
          if [ -n "$found" ]; then
            echo "Строки матрицы без идентификатора требования:"
            echo "$found"
            exit 1
          fi

      - name: Every quality requirement has a number
        run: |
          set -euo pipefail
          found=$(awk '
            /^### `NFR/ { if (h != "" && !n) print h; h = $0; n = 0; next }
            /^#/        { if (h != "" && !n) print h; h = ""; next }
            h != "" && /[0-9]+ *(мс|с|%|мин|команд)/ { n = 1 }
            END         { if (h != "" && !n) print h }
          ' docs/requirements.md)
          if [ -n "$found" ]; then
            echo "Требования к качеству без величины с единицей:"
            echo "$found"
            exit 1
          fi

  decisions:
    name: Decision records are complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required sections present
        run: |
          set -euo pipefail
          failed=0
          for file in docs/adr/[0-9]*.md; do
            for section in "## Контекст" "## Движущие факторы" \
                           "## Рассмотренные варианты" "## Решение" "## Последствия"; do
              grep -q "^$section" "$file" || { echo "$file: нет раздела «$section»"; failed=1; }
            done
            grep -q "Отрицательные" "$file" \
              || { echo "$file: нет отрицательных последствий"; failed=1; }
            grep -q "Что пересмотрит решение" "$file" \
              || { echo "$file: нет условия пересмотра"; failed=1; }
            grep -q "^- \*\*Статус\*\*" "$file" \
              || { echo "$file: нет статуса"; failed=1; }
            grep -qE '`(FR|NFR|BR|C)-[0-9]+`' "$file" \
              || { echo "$file: нет ссылок на требования"; failed=1; }
            n=$(sed -n '/^## Рассмотренные варианты/,/^## /p' "$file" | grep -c '^|' || true)
            [ "$n" -ge 4 ] || { echo "$file: вариантов меньше двух"; failed=1; }
          done
          exit $failed

      - name: Every record is listed in the index
        run: |
          set -euo pipefail
          failed=0
          for file in docs/adr/[0-9]*.md; do
            grep -q "$(basename "$file")" docs/adr/README.md \
              || { echo "$(basename "$file") отсутствует в указателе"; failed=1; }
          done
          exit $failed

  diagrams:
    name: Diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render every diagram
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          echo '{"args": ["--no-sandbox"]}' > /tmp/puppeteer.json
          failed=0
          for file in docs/**/*.mmd; do
            echo "== $file"
            npx --yes @mermaid-js/mermaid-cli@11.4.0 -p /tmp/puppeteer.json \
              -i "$file" -o "/tmp/$(basename "$file").svg" \
              || { echo "НЕ ОТРИСОВЫВАЕТСЯ: $file"; failed=1; }
          done
          exit $failed
